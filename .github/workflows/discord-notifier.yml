name: Discord Notifier

on: [push] # This triggers the bot on every code push

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Message to Discord
        # Values are passed through env (not pasted into the script) so quotes or
        # newlines in a commit message can't break the JSON or run as shell code.
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          payload=$(jq -n --arg actor "$ACTOR" --arg msg "$COMMIT_MSG" \
            '{content: "**Update:** New code has been pushed to the repository by \($actor)! \n**Commit:** \($msg)"}')
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "$payload" \
          "$DISCORD_WEBHOOK"
