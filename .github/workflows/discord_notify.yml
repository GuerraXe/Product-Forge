name: Discord Custom Notification

on:
  push:
    branches:
      - main  # Change this to match your default branch name if it isn't main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Must checkout code first to scan files
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Automatically identify which files changed
      - name: Get changed files
        id: files
        uses: jitterbit/get-changed-files@v1
        continue-on-error: true

      # Step 3: Run your curl payload with the file list included
      - name: Send custom payload to Discord
        run: |
          # Format the list with bullet points and clean line breaks
          CHANGED_FILES=$(echo "${{ steps.files.outputs.all }}" | tr ' ' '\n' | sed 's/^/- /')
          
          if [ -z "$CHANGED_FILES" ]; then
            CHANGED_FILES="- No specific files detected"
          fi

          curl -H "Content-Type: application/json" \
               -X POST \
               -d JSON_PAYLOAD=$(cat <<EOF
               {
                 "username": "Servo-Skull of Progress Updates",
                 "avatar_url": "https://cdn.discordapp.com/avatars/1555043047304208475/65ba2ff30cc1dcce15fab9c0c8df7840.webp?size=320",
                 "embeds": [
                   {
                     "title": "Update",
                     "description": "**Commit Message:** ${{ github.event.head_commit.message }}\n**Author:** ${{ github.event.head_commit.author.username }}\n\n**📁 File Locations:**\n${CHANGED_FILES}",
                     "url": "${{ github.event.head_commit.url }}",
                     "color": 15105570
                   }
                 ]
               }
               EOF
               ) \
               -d "$JSON_PAYLOAD" \
               ${{ secrets.DISCORD_WEBHOOK_URL }}

