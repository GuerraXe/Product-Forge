name: Discord Custom Notification

on:
  push:
    branches:
      - main  # Change this to match your default branch name if it isn't main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send custom payload to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Get the file path summary line safely directly from git
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | sed 's/^/- /' | paste -sd '\\n' -)
          
          if [ -z "$CHANGED_FILES" ]; then
            CHANGED_FILES="- No specific files detected"
          fi

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"username\": \"Servo-Skull of Progress Updates\",
                 \"avatar_url\": \"https://discordapp.com\",
                 \"embeds\": [
                   {
                     \"title\": \"Update\",
                     \"description\": \"**Commit Message:** ${{ github.event.head_commit.message }}\\n**Author(s):** ${{ github.event.head_commit.author.username }}\\n\\n** File Location(s):**\\n${CHANGED_FILES}\",
                     \"url\": \"${{ github.event.head_commit.url }}\",
                     \"color\": 15105570
                   }
                 ]
               }" \
               $DISCORD_WEBHOOK_URL
